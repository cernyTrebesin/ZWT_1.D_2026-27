<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seznamy</title>
</head>
<body>
    Adepti na napomenutí:
    <ol type="I" start="5" reversed>
        <li>Aleš</li>
        <li type="A">Stefan</li>
        <li>Pavel</li>
    </ol>
    Adepti na pochvalu:
    <ul type="disc">
        <li>Šimon H.</li>
        <li type="circle">Nik</li>
        <li>Sofie</li>
        <li>Celá 1.D</li>
    </ul>
    Důvody proč miluju matematiku:
    <ul>
        <li>Je to fun</li>
        <li>Dovídám se zajímavé věci</li>
        <ol>
            <li>Všechno chápu</li>
            <li>Nemůžu se dočkat další hodiny</li>
        </ol>
        <li>Vůbec to není bolest</li>
    </ul>
</body>
</html>
