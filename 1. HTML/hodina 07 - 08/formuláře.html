<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuláře</title>
</head>
<body>
    <form action="">
        <label for="jmeno">Jméno:</label>
        <input type="text" id="jmeno" placeholder="Tomáš"> <br>
        <label for="vek">Věk:</label>
        <input type="number" id="vek" min="10" max="50"><br>
        <label for="datum">Datum narození:</label>
        <input type="date" id="datum"> <br>
        <label for="muz">Muž</label>
        <input type="radio" id="muz" name="pohlavi">
        <label for="zena" >Žena</label>
        <input type="radio" id="zena" name="pohlavi">
        <label for="jine">Jiné</label>
        <input type="radio" id="jine" name="pohlavi">
        <br>
        <label for="manzel">V manželství</label>
        <input type="checkbox" id="manzel" name="stav">
        <label for="rozveden">Rozvedený/á</label>
        <input type="checkbox" id="rozveden" name="stav" required>
        <br>
        <label for="auto">Jaké auto řídíš</label>
        <select id="auto">
            <option value="">Škoda</option>
            <option value="">BMW</option>
            <option value="">Tesla</option>
            <option value="">Mercedez</option>
        </select>
        <br>
        <input type="button" value="Něco">
        <input type="reset">
        <input type="submit">

    </form>
</body>
</html>
